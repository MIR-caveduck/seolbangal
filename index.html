const entries=[{date:'2026-11-11',title:'메이드복과 함께한 달콤한 하루',body:`11월 11일은 농업인의 날이기도 하지만, 오늘만큼은 메이드복을 입은 아씨 덕분에 더 특별한 빼빼로데이가 된 것 같네요 ㅋㅋ

빼빼로데이에 맞춰 귀엽게 준비한 모습도 너무 예뻤고, 한동안 이어진 룰렛도 즐거웠어요.

그리고 룰렛이 어느 정도 마무리되고 나서 나눴던 애니 이야기도 참 좋았어요. 좋아하는 이야기가 나오니까 신나서 이것저것 이야기하는 모습이 어찌나 귀엽던지 ㅋㅋ 그런 모습을 보고 있으니 저까지 괜히 즐거워지더라고요.

카페를 둘러보면서 소소하게 이야기 나누던 시간도 좋았고, 무엇보다 제가 만든 팬아트 갤러리도 직접 봐주고 좋은 반응을 보여줘서 정말 기뻤어요. 열심히 만들었던 시간이 보람 있게 느껴지는 순간이었달까요.

생각해 보면 꼭 특별한 일이 있어야 즐거운 방송이 되는 건 아닌 것 같아요. 이렇게 소소한 이야기를 나누고, 함께 웃고, 좋아하는 것에 신나하는 모습을 보는 것만으로도 충분히 행복한 시간이 되니까요.

const dates=document.getElementById('dates'),article=document.getElementById('article');let selected=0;function render(){dates.innerHTML='';let prev='';entries.forEach((e,i)=>{const m=e.date.slice(0,7);if(m!==prev){let d=document.createElement('div');d.className='month';d.textContent=m.replace('-','년 ')+'월';dates.append(d);prev=m}let b=document.createElement('button');b.className='date'+(i===selected?' active':'');b.textContent='✿ '+Number(e.date.slice(5,7))+'월 '+Number(e.date.slice(8))+'일';b.onclick=()=>{selected=i;render()};dates.append(b)});const e=entries[selected];article.innerHTML='';let label=document.createElement('div');label.className='eyebrow';label.textContent='✿ TODAY’S MEMORY';let title=document.createElement('h2');title.textContent=e.title;let meta=document.createElement('div');meta.className='meta';meta.textContent=e.date+'  ·  설뱅알';let body=document.createElement('div');body.className='bodytext';body.textContent=e.body;let closing=document.createElement('div');closing.className='closing';closing.textContent=e.closing;article.append(label,title,meta,body,closing);if(e.photos){let section=document.createElement("section");section.className="photo-section";let heading=document.createElement("h3");heading.className="photo-heading";heading.textContent="🌸 오늘의 아씨, 사진으로 남기기";let grid=document.createElement("div");grid.className="photo-grid";e.photos.forEach((src,i)=>{let figure=document.createElement("figure"),img=document.createElement("img"),caption=document.createElement("figcaption");img.src=src;img.alt="11월 11일 아씨 방송 사진 "+(i+1);img.loading="lazy";caption.textContent="11월 11일의 귀여운 순간 · "+(i+1);figure.append(img,caption);grid.append(figure)});section.append(heading,grid);article.append(section)}}render();document.getElementById('power').onclick=()=>{document.getElementById('power').classList.add('on');document.getElementById('screenmsg').textContent='🌸 설뱅알에 오신 것을 환영합니다! 🌸';setTimeout(()=>{document.getElementById('intro').classList.add('hide');document.getElementById('app').classList.add('show')},850)};
